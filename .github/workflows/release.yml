name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android version code
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      AI_INTERVIEW_API_BASE_URL: ${{ vars.AI_INTERVIEW_API_BASE_URL }}
      AI_INTERVIEW_VERSION_NAME: ${{ inputs.version_name }}
      AI_INTERVIEW_VERSION_CODE: ${{ inputs.version_code }}
      AI_INTERVIEW_RELEASE_STORE_FILE: release-signing.jks
      AI_INTERVIEW_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      AI_INTERVIEW_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AI_INTERVIEW_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Validate release inputs
        run: |
          test -n "$AI_INTERVIEW_API_BASE_URL"
          case "$AI_INTERVIEW_API_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          test -n "$AI_INTERVIEW_RELEASE_STORE_PASSWORD"
          test -n "$AI_INTERVIEW_RELEASE_KEY_ALIAS"
          test -n "$AI_INTERVIEW_RELEASE_KEY_PASSWORD"
      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release-signing.jks
      - name: Test and build signed release
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ai-interview-${{ inputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
