services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-interview-rag-service:0.2.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8000
      RAG_DATA_DIR: /service/data
      RAG_VECTOR_DB_PATH: /service/data/rag.db
      RAG_UPLOAD_DIR: /service/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - rag-data:/service/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  rag-data:
